name: synheart_session
description: Flutter SDK for Synheart Session — stream-based session API with typed events for HR metrics and behavioral signals.
version: 0.1.0
homepage: https://github.com/synheart-ai/synheart-session-dart
repository: https://github.com/synheart-ai/synheart-session-dart
issue_tracker: https://github.com/synheart-ai/synheart-session-dart/issues
license: Apache-2.0
topics:
  - session
  - biosignals
  - wearable
  - flutter
  - health

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  synheart_behavior: ^0.1.0
  synheart_wear: ^0.1.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SynheartSessionPlugin
      android:
        package: ai.synheart.session
        pluginClass: SynheartSessionPlugin
